[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "m3alpaca"
version = "0.1.0"
description = "ASCOM Alpaca camera driver for a Canon EOS M3 running CHDK (USB remote capture), e.g. for N.I.N.A."
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "radorybar" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "pyusb>=1.2",
    "libusb-package>=1.0.26",  # bundled libusb-1.0 DLL for Windows (WinUSB driver via Zadig)
]

[project.urls]
Homepage = "https://github.com/radorybar/canon-m3-ascom"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
m3alpaca = "m3alpaca.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/m3alpaca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
