[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "canon-m3-ascom"
version = "0.2.0"
description = "ASCOM Alpaca camera driver for a Canon EOS M3 running CHDK (USB remote capture), e.g. for N.I.N.A."
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "radorybar" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "pyusb>=1.2",
    "libusb-package>=1.0.26",  # bundled libusb-1.0 DLL for Windows (WinUSB driver via Zadig)
    "comtypes>=1.4; sys_platform == 'win32'",  # Windows Portable Devices transport (standard driver)
    "pystray>=0.19",  # notification-area icon (--tray)
    "pillow>=10",  # icon images for pystray
]

[project.urls]
Homepage = "https://github.com/radorybar/canon-m3-ascom"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
canon-m3-ascom = "canon_m3_ascom.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/canon_m3_ascom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
