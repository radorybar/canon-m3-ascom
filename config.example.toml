# Copy to config.toml and run:  .venv\Scripts\m3alpaca.exe --config config.toml

[server]
host = "0.0.0.0"          # all interfaces (needed for discovery); "127.0.0.1" = local only,
                          # then add the camera in N.I.N.A. as "Alpaca Direct" 127.0.0.1:11112
port = 11112
discovery = true          # answer Alpaca discovery on UDP 32227
imagebytes_uint16 = true  # false -> send Int32 pixels (try if N.I.N.A. shows garbage)

[camera]
backend = "sim"           # "sim" = simulated star field
                          # "ptp" = real camera, built-in CHDK PTP client (WinUSB driver via Zadig)
                          # "chdk" = real camera through an external chdkptp.exe
exposure_min = 0.00025    # 1/4000 s
exposure_max = 300.0       # verified on the M3 up to 120 s (CHDK allows up to 2048 s)
default_iso = 800
# frames_dir = "C:/Users/<you>/AppData/Local/m3alpaca/frames"

[ptp]
pid = 0                   # USB product id, 0 = first Canon camera (EOS M3 is 0x3299)
lcd_off = false           # switch the camera LCD off after connecting (less sensor heat)
prevent_shutdown = true   # CHDK "prevent shutdown" = always
dark_frame_off = true     # no automatic in-camera dark frame (doubles exposure time otherwise)
timeout_extra_s = 30.0
keep_raw = false          # also save every raw buffer (.raw) into camera.frames_dir
# fake = true             # emulate the camera on USB/PTP level (same as --fake-camera)

[chdk]
command = ["C:/tools/chdkptp/chdkptp.exe"]
# Camera emulator instead of the real chdkptp:
# command = [".venv/Scripts/python.exe", "-m", "m3alpaca.fakechdk"]
format = "raw"
timeout_extra_s = 30.0
keep_files = false        # true keeps the .raw files in frames_dir
lcd_off = true
prevent_shutdown = true

[sim]
download_s = 3.0          # simulated USB transfer time
roundtrip_codec = true
# Couple star sharpness to a focuser (ASCOM OmniSimulator focuser) to test N.I.N.A. autofocus:
# focuser_url = "http://127.0.0.1:32323/api/v1/focuser/0"
best_focus = 5000
stars = 600
temperature_c = 18.0
